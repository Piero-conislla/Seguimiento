<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tablero Kanban Agile</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg-primary: #ffffff;
      --bg-secondary: #f5f5f5;
      --bg-tertiary: #f0f0f0;
      --text-primary: #0b0b0b;
      --text-secondary: #52514e;
      --text-muted: #898781;
      --border: rgba(11, 11, 11, 0.1);
      --border-strong: rgba(11, 11, 11, 0.2);
      --accent: #378ADD;
      --accent-light: #e6f1fb;
      --danger: #E24B4A;
      --danger-light: #FCEBEB;
      --warning: #BA7517;
      --warning-light: #FAEEDA;
      --success: #0ca30c;
      --success-light: #EAF3DE;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
      background: var(--bg-secondary);
      color: var(--text-primary);
      line-height: 1.6;
    }

    .container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 24px 16px;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      flex-wrap: wrap;
      gap: 16px;
    }

    h1 {
      font-size: 28px;
      font-weight: 600;
    }

    .header-controls {
      display: flex;
      gap: 12px;
      align-items: center;
    }

    select, input, button {
      font-family: inherit;
      font-size: 14px;
    }

    button {
      padding: 8px 16px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 500;
      transition: all 0.2s;
    }

    button:hover {
      opacity: 0.9;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .btn-primary {
      background: var(--accent);
      color: white;
    }

    .btn-secondary {
      background: white;
      border: 1px solid var(--border-strong);
      color: var(--text-primary);
    }

    select {
      padding: 6px 12px;
      border: 1px solid var(--border-strong);
      border-radius: 6px;
      background: white;
      color: var(--text-primary);
    }

    .status-banner {
      display: none;
      padding: 10px 16px;
      border-radius: 6px;
      font-size: 13px;
      margin-bottom: 16px;
    }

    .status-banner.show {
      display: block;
    }

    .status-banner.error {
      background: var(--danger-light);
      color: var(--danger);
    }

    .status-banner.info {
      background: var(--accent-light);
      color: var(--accent);
    }

    .kanban-board {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 16px;
      margin-bottom: 32px;
      min-height: 650px;
    }

    .kanban-column {
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
      display: flex;
      flex-direction: column;
    }

    .column-header {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-secondary);
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .cards-drop-zone {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 8px;
      min-height: 100px;
      padding: 4px;
      border-radius: 4px;
      transition: background 0.2s;
    }

    .cards-drop-zone.drag-over {
      background: var(--accent-light);
      border: 2px dashed var(--accent);
    }

    .card {
      background: white;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 12px;
      cursor: grab;
      transition: all 0.2s;
      user-select: none;
    }

    .card:hover {
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      transform: translateY(-2px);
    }

    .card:active {
      cursor: grabbing;
      opacity: 0.8;
    }

    .card-title {
      font-weight: 500;
      font-size: 14px;
      margin-bottom: 8px;
      color: var(--text-primary);
      word-break: break-word;
    }

    .card-meta {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      font-size: 11px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      padding: 2px 8px;
      border-radius: 12px;
      background: var(--accent-light);
      color: var(--accent);
      font-weight: 500;
    }

    .badge.high {
      background: var(--danger-light);
      color: var(--danger);
    }

    .badge.medium {
      background: var(--warning-light);
      color: var(--warning);
    }

    .badge.low {
      background: var(--success-light);
      color: var(--success);
    }

    .badge.blocked {
      background: var(--danger-light);
      color: var(--danger);
    }

    .assignee-badge {
      background: var(--bg-tertiary);
      color: var(--text-primary);
      padding: 2px 6px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: 500;
    }

    .metrics-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
      margin-bottom: 32px;
    }

    .metric-card {
      background: white;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 20px;
      text-align: center;
    }

    .metric-label {
      font-size: 12px;
      color: var(--text-secondary);
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .metric-value {
      font-size: 32px;
      font-weight: 700;
      color: var(--text-primary);
    }

    .metric-sub {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 6px;
    }

    .charts-section {
      background: white;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 24px;
      margin-bottom: 32px;
    }

    .charts-section h2 {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 24px;
      color: var(--text-primary);
    }

    .charts-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
      gap: 32px;
    }

    .chart-container {
      position: relative;
      height: 280px;
    }

    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: var(--text-muted);
      font-size: 13px;
    }

    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.5);
      z-index: 1000;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .modal.active {
      display: flex;
    }

    .modal-content {
      background: white;
      border-radius: 8px;
      padding: 32px;
      width: 100%;
      max-width: 500px;
      max-height: 90vh;
      overflow-y: auto;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
    }

    .modal-content h2 {
      font-size: 20px;
      font-weight: 600;
      margin-bottom: 20px;
      color: var(--text-primary);
    }

    .form-group {
      margin-bottom: 16px;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      margin-bottom: 6px;
      color: var(--text-secondary);
    }

    input[type="text"],
    select {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--border-strong);
      border-radius: 6px;
      font-size: 14px;
      color: var(--text-primary);
    }

    input[type="text"]:focus,
    select:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 2px var(--accent-light);
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    .modal-buttons {
      display: flex;
      gap: 12px;
      margin-top: 24px;
    }

    .modal-buttons button {
      flex: 1;
      padding: 12px 16px;
    }

    @media (max-width: 768px) {
      .kanban-board {
        grid-template-columns: 1fr;
      }

      .charts-grid {
        grid-template-columns: 1fr;
      }

      .header {
        flex-direction: column;
        align-items: flex-start;
      }

      .header-controls {
        width: 100%;
        flex-direction: column;
      }

      .header-controls > * {
        width: 100%;
      }
    }

    .footer {
      text-align: center;
      padding: 24px;
      color: var(--text-muted);
      font-size: 12px;
      border-top: 1px solid var(--border);
      margin-top: 32px;
    }

    .info-text {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 8px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div>
        <h1>📊 Tablero Kanban Agile</h1>
        <p class="info-text">Seguimiento en tiempo real de sprints y proyectos, compartido con tu equipo</p>
      </div>
      <div class="header-controls">
        <button id="addCardBtn" class="btn-primary">+ Nueva tarea</button>
      </div>
    </div>

    <div id="statusBanner" class="status-banner"></div>

    <div id="metricsGrid" class="metrics-grid"></div>

    <div class="kanban-board" id="kanbanBoard"></div>

    <div class="charts-section">
      <h2>Velocidad y tendencia</h2>
      <div class="charts-grid">
        <div class="chart-container">
          <canvas id="velocityChart"></canvas>
        </div>
        <div class="chart-container">
          <canvas id="burndownChart"></canvas>
        </div>
      </div>
    </div>
  </div>

  <div id="modalNewTask" class="modal">
    <div class="modal-content">
      <h2>Nueva tarea</h2>

      <div class="form-group">
        <label>Título *</label>
        <input id="taskTitle" type="text" placeholder="Ej: Implementar login OAuth">
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>Story Points</label>
          <select id="taskPoints">
            <option value="1">1</option>
            <option value="2">2</option>
            <option value="3">3</option>
            <option value="5" selected>5</option>
            <option value="8">8</option>
            <option value="13">13</option>
          </select>
        </div>
        <div class="form-group">
          <label>Prioridad</label>
          <select id="taskPriority">
            <option value="low">Baja</option>
            <option value="medium" selected>Media</option>
            <option value="high">Alta</option>
          </select>
        </div>
      </div>

      <div class="form-group">
        <label>Asignado a</label>
        <input id="taskAssignee" type="text" placeholder="Nombre de la persona (opcional)">
      </div>

      <div class="modal-buttons">
        <button id="saveTaskBtn" class="btn-primary">Crear tarea</button>
        <button id="closeModalBtn" class="btn-secondary">Cancelar</button>
      </div>
    </div>
  </div>

  <div class="footer">
    <p>Tablero Kanban · Gestión Agile de Proyectos</p>
  </div>

  <script>
    // Estas dos llaves son públicas por diseño: el acceso real lo controlan
    // las reglas de acceso (RLS) configuradas en la tabla "tasks" de Supabase.
    const SUPABASE_URL = 'https://kqiuatawstjkppyrdlin.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtxaXVhdGF3c3Rqa3BweXJkbGluIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY3OTcyNzcsImV4cCI6MjEwMjM3MzI3N30.z4uXfvtREL_aUED9irZoZ4dGXHolARu-tsyK9-5sVv4';

    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const columns = ['backlog', 'todo', 'progress', 'review', 'done'];
    const columnNames = {
      backlog: 'Backlog',
      todo: 'Por hacer',
      progress: 'En progreso',
      review: 'Revisión',
      done: 'Completado'
    };

    let tasks = [];

    let currentCharts = {
      velocity: null,
      burndown: null
    };

    function generateId() {
      return Date.now().toString(36) + Math.random().toString(36).substr(2);
    }

    function showBanner(message, type) {
      const banner = document.getElementById('statusBanner');
      banner.textContent = message;
      banner.className = `status-banner show ${type}`;
    }

    function hideBanner() {
      document.getElementById('statusBanner').classList.remove('show');
    }

    async function loadTasks() {
      const { data, error } = await supabaseClient
        .from('tasks')
        .select('*')
        .order('created_at', { ascending: true });

      if (error) {
        showBanner('No se pudo conectar con la base de datos. Revisa tu conexión e intenta de nuevo.', 'error');
        console.error(error);
        return;
      }

      hideBanner();
      tasks = data;
      renderKanban();
      renderMetrics();
      renderCharts();
    }

    function renderKanban() {
      const board = document.getElementById('kanbanBoard');
      board.innerHTML = '';

      columns.forEach(col => {
        const colTasks = tasks.filter(t => t.status === col);
        const points = colTasks.reduce((sum, t) => sum + parseInt(t.points), 0);

        const colDiv = document.createElement('div');
        colDiv.className = 'kanban-column';

        const header = document.createElement('div');
        header.className = 'column-header';
        header.innerHTML = `
          <span>${columnNames[col]}</span>
          <span>${colTasks.length} (${points}pt)</span>
        `;

        const zone = document.createElement('div');
        zone.className = 'cards-drop-zone';
        zone.dataset.status = col;

        if (colTasks.length === 0 && tasks.length === 0 && col === 'backlog') {
          zone.innerHTML = '<div class="empty-state">Todavía no hay tareas.<br>Crea la primera con "+ Nueva tarea".</div>';
        }

        colTasks.forEach(task => {
          const card = createTaskCard(task);
          zone.appendChild(card);
        });

        zone.addEventListener('dragover', (e) => {
          e.preventDefault();
          zone.classList.add('drag-over');
        });

        zone.addEventListener('dragleave', () => {
          zone.classList.remove('drag-over');
        });

        zone.addEventListener('drop', async (e) => {
          e.preventDefault();
          zone.classList.remove('drag-over');
          const taskId = e.dataTransfer.getData('taskId');
          const task = tasks.find(t => t.id === taskId);
          if (task && task.status !== col) {
            await updateTaskStatus(taskId, col);
          }
        });

        colDiv.appendChild(header);
        colDiv.appendChild(zone);
        board.appendChild(colDiv);
      });
    }

    function createTaskCard(task) {
      const card = document.createElement('div');
      card.className = 'card';
      card.draggable = true;

      const priorityIcon = task.priority === 'high' ? '🔴' : task.priority === 'medium' ? '🟡' : '🟢';
      const assigneeLabel = task.assignee ? task.assignee.trim().substring(0, 1).toUpperCase() : '';

      let badges = `<span class="badge">${task.points} pts</span><span class="badge ${task.priority}">${priorityIcon}</span>`;
      if (task.blocked) {
        badges += '<span class="badge blocked">🚫 Bloqueado</span>';
      }
      if (assigneeLabel) {
        badges += `<span class="assignee-badge" title="${escapeHtml(task.assignee)}">${assigneeLabel}</span>`;
      }

      card.innerHTML = `
        <div class="card-title">${escapeHtml(task.title)}</div>
        <div class="card-meta">${badges}</div>
      `;

      card.addEventListener('dragstart', (e) => {
        e.dataTransfer.effectAllowed = 'move';
        e.dataTransfer.setData('taskId', task.id);
      });

      card.addEventListener('dblclick', async () => {
        if (confirm('¿Marcar esta tarea como completada?')) {
          await updateTaskStatus(task.id, 'done');
        }
      });

      card.addEventListener('contextmenu', async (e) => {
        e.preventDefault();
        if (confirm('¿Eliminar esta tarea?')) {
          await deleteTask(task.id);
        }
      });

      return card;
    }

    async function updateTaskStatus(taskId, newStatus) {
      const { error } = await supabaseClient
        .from('tasks')
        .update({ status: newStatus })
        .eq('id', taskId);

      if (error) {
        showBanner('No se pudo guardar el cambio. Intenta de nuevo.', 'error');
        console.error(error);
      }
      // No hace falta recargar a mano: la suscripción en tiempo real actualiza la pantalla.
    }

    async function deleteTask(taskId) {
      const { error } = await supabaseClient
        .from('tasks')
        .delete()
        .eq('id', taskId);

      if (error) {
        showBanner('No se pudo eliminar la tarea. Intenta de nuevo.', 'error');
        console.error(error);
      }
    }

    function renderMetrics() {
      const done = tasks.filter(t => t.status === 'done');
      const donePoints = done.reduce((sum, t) => sum + parseInt(t.points), 0);
      const total = tasks.reduce((sum, t) => sum + parseInt(t.points), 0);
      const inProgress = tasks.filter(t => t.status === 'progress').length;
      const blocked = tasks.filter(t => t.blocked).length;
      const remaining = total - donePoints;
      const velocity = total > 0 ? Math.round((donePoints / total) * 100) : 0;

      const metrics = [
        { label: 'Completado', value: `${donePoints}/${total}`, sub: `${velocity}% del sprint` },
        { label: 'Puntos restantes', value: remaining, sub: 'Por entregar' },
        { label: 'En progreso', value: inProgress, sub: 'Tareas activas' },
        { label: 'Bloqueadas', value: blocked, sub: 'Requieren atención' },
      ];

      const grid = document.getElementById('metricsGrid');
      grid.innerHTML = metrics.map(m => `
        <div class="metric-card">
          <div class="metric-label">${m.label}</div>
          <div class="metric-value">${m.value}</div>
          <div class="metric-sub">${m.sub}</div>
        </div>
      `).join('');
    }

    function renderCharts() {
      const donePoints = tasks.filter(t => t.status === 'done').reduce((s, t) => s + parseInt(t.points), 0);
      const totalPoints = tasks.reduce((sum, t) => sum + parseInt(t.points), 0);
      const remaining = totalPoints - donePoints;

      const velocityCTX = document.getElementById('velocityChart').getContext('2d');
      if (currentCharts.velocity) currentCharts.velocity.destroy();

      currentCharts.velocity = new Chart(velocityCTX, {
        type: 'bar',
        data: {
          // Los sprints anteriores todavía no tienen historial real: arrancan en 0
          // y se van a ir llenando solos a medida que completen sprints de verdad.
          labels: ['Sprint anterior', 'Sprint anterior', 'Sprint actual'],
          datasets: [{
            label: 'Puntos entregados',
            data: [0, 0, donePoints],
            backgroundColor: '#378ADD',
            borderRadius: 4,
            borderSkipped: false,
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: { display: false }
          },
          scales: {
            y: {
              beginAtZero: true,
              ticks: { stepSize: 10 }
            }
          }
        }
      });

      const burndownCTX = document.getElementById('burndownChart').getContext('2d');
      if (currentCharts.burndown) currentCharts.burndown.destroy();

      currentCharts.burndown = new Chart(burndownCTX, {
        type: 'line',
        data: {
          labels: ['Inicio', 'Hoy'],
          datasets: [
            {
              label: 'Ideal',
              data: [totalPoints, 0],
              borderColor: '#888780',
              borderWidth: 2,
              fill: false,
              pointRadius: 4,
              tension: 0.3,
            },
            {
              label: 'Real',
              data: [totalPoints, remaining],
              borderColor: '#378ADD',
              borderWidth: 3,
              fill: false,
              pointRadius: 5,
              tension: 0.3,
            }
          ]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: {
              display: true,
              position: 'bottom'
            }
          },
          scales: {
            y: {
              beginAtZero: true,
              max: Math.max(totalPoints, 10)
            }
          }
        }
      });
    }

    document.getElementById('addCardBtn').addEventListener('click', () => {
      document.getElementById('modalNewTask').classList.add('active');
      document.getElementById('taskTitle').focus();
    });

    document.getElementById('closeModalBtn').addEventListener('click', () => {
      document.getElementById('modalNewTask').classList.remove('active');
    });

    document.getElementById('modalNewTask').addEventListener('click', (e) => {
      if (e.target.id === 'modalNewTask') {
        document.getElementById('modalNewTask').classList.remove('active');
      }
    });

    document.getElementById('saveTaskBtn').addEventListener('click', async () => {
      const title = document.getElementById('taskTitle').value.trim();
      const points = document.getElementById('taskPoints').value;
      const priority = document.getElementById('taskPriority').value;
      const assignee = document.getElementById('taskAssignee').value.trim();
      const saveBtn = document.getElementById('saveTaskBtn');

      if (!title) {
        alert('Ingresa un título para la tarea');
        return;
      }

      saveBtn.disabled = true;

      const { error } = await supabaseClient.from('tasks').insert({
        id: generateId(),
        title,
        points: parseInt(points),
        priority,
        status: 'todo',
        assignee,
        blocked: false
      });

      saveBtn.disabled = false;

      if (error) {
        showBanner('No se pudo crear la tarea. Intenta de nuevo.', 'error');
        console.error(error);
        return;
      }

      document.getElementById('taskTitle').value = '';
      document.getElementById('taskPoints').value = '5';
      document.getElementById('taskPriority').value = 'medium';
      document.getElementById('taskAssignee').value = '';
      document.getElementById('modalNewTask').classList.remove('active');
    });

    document.getElementById('taskTitle').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') {
        document.getElementById('saveTaskBtn').click();
      }
    });

    function escapeHtml(text) {
      const map = {
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#039;'
      };
      return text.replace(/[&<>"']/g, m => map[m]);
    }

    // Cada vez que alguien del equipo crea, mueve o borra una tarea, este canal
    // avisa a todos los demás navegadores abiertos para que se actualicen solos.
    supabaseClient
      .channel('tasks-changes')
      .on('postgres_changes', { event: '*', schema: 'public', table: 'tasks' }, () => {
        loadTasks();
      })
      .subscribe();

    loadTasks();
  </script>
